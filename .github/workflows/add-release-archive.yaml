# Add a zip built for new ES-version to existing release
name: Add release archive
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        required: true
        type: string
        description: "Release version to checkout"
      opensearchVersion:
        required: true
        type: string
        description: "Version of target OpenSearch"

# version: ${{ github.event.inputs.version }}
jobs:
  # TODO: duplication from build.yaml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ github.event.inputs.releaseVersion }}
      - uses: actions/setup-java@v1
        with:
          java-version: 8
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build -DbaseVersion=${{ github.event.inputs.releaseVersion }} -DopensearchVersion=${{ github.event.inputs.opensearchVersion }}
      - name: Upload the artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v${{ github.event.inputs.releaseVersion }} build/distributions/*.zip --clobber
