name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        opensearchVersion: ['3.0.0', '3.8.0']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build -DopensearchVersion=${{ matrix.opensearchVersion }}
