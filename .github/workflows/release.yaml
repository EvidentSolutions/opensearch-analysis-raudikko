name: Release
on:
  release:
    types: [ published ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Assume that input tag is formatted like 'v1.2.3' and transforms that to '1.2.3'
      - name: Normalize version
        id: normalize-version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const tagName = context.payload.release.tag_name;
            if (tagName.startsWith("v")) {
                const version = tagName.substring(1);
                console.log(`Setting version to ${version}`);
                core.setOutput('version', version);
            } else {
                core.setFailed(`Release tag ${tagName} does not have a prefix 'v'`);
            }
    outputs:
      version: ${{ steps.normalize-version.outputs.version }}

  # TODO: duplication from build.yaml
  build:
    needs: [ prepare ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        opensearchVersion: [ '2.10.0', '2.11.0', '2.12.0', '2.13.0', '2.14.0', '3.4.0', '3.5.0', '3.6.0', '3.7.0', '3.8.0' ]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew build -DbaseVersion=${{ needs.prepare.outputs.version }} -DopensearchVersion=${{ matrix.opensearchVersion }}
      - name: Upload the artifacts
        uses: skx/github-action-publish-binaries@b9ca5643b2f1d7371a6cba7f35333f1461bbc703 # release-2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: 'build/distributions/*.zip'
